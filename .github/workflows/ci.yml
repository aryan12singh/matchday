name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # repo-check + lint + typecheck + unit tests + build.
      - name: Check
        run: pnpm check
        env:
          # Build-time only; real values live in Vercel. Present so the Next build does
          # not fail on missing public vars once clients are wired in Task 3.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  database:
    # The lock trigger, the immutability guards and the RLS reveal rules are the controls
    # the whole product rests on. They run against a real Postgres on every change, not
    # only when someone remembers to run them locally.
    name: database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local stack
        run: supabase start

      - name: Migrations apply clean and seed loads
        run: supabase db reset

      - name: Locks, immutability and RLS tests
        run: supabase test db
