<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--text);font:var(--text-body);padding:20px}*{box-sizing:border-box}

  <span style="display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:6px;background:var(--live-dim);border:1px solid var(--live)"><span style="font:var(--text-label);letter-spacing:.12em;color:var(--live)">LOCKS IN</span><span style="font:var(--text-num-sm);font-variant-numeric:tabular-nums;color:var(--live)">00:42:10</span></span>
</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">

  <span style="display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:6px;background:var(--success-dim)"><span style="font:var(--text-label);letter-spacing:.12em;color:var(--success)">SETTLED</span></span>

<div style="display:flex;align-items:center;gap:12px">

  <div style="flex:1;height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden"><div style="width:29%;height:100%;background:var(--text-3);border-radius:4px"></div></div>
